<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱图库 - 祖家琦 ❤️ 王意颖</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="heart-background">
        <div class="floating-heart" style="left: 10%; animation-delay: 0s;">💕</div>
        <div class="floating-heart" style="left: 25%; animation-delay: 1s;">💖</div>
        <div class="floating-heart" style="left: 40%; animation-delay: 2s;">💗</div>
        <div class="floating-heart" style="left: 60%; animation-delay: 0.5s;">💕</div>
        <div class="floating-heart" style="left: 75%; animation-delay: 1.5s;">💖</div>
        <div class="floating-heart" style="left: 90%; animation-delay: 2.5s;">❤️</div>
    </div>

    <div class="container">
        <header class="gallery-header">
            <h1 class="gallery-title">📸 恋爱图库</h1>
            <p class="gallery-subtitle">记录我们每一个甜蜜的瞬间</p>
            <div class="back-nav">
                <a href="index.html" class="back-button">🏠 返回首页</a>
            </div>
        </header>

        <div class="gallery-content">
            <!-- 照片上传区域 -->
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <p class="upload-text">点击或拖拽照片到此处上传</p>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                </div>

                <div class="upload-actions">
                    <button class="btn btn-primary" id="savePhotosBtn">💾 保存照片</button>
                    <button class="btn btn-secondary" id="clearPhotosBtn">🗑️ 清空照片</button>
                </div>
            </div>

            <!-- 照片网格 -->
            <div class="gallery-grid" id="galleryGrid">
                <!-- 照片将在这里动态生成 -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // 拖尾式光标跟随效果
        const cursorTrail = [];
        const maxTrailLength = 10;

        document.addEventListener('mousemove', (e) => {
            // 创建新的光标元素
            const cursor = document.createElement('div');
            cursor.className = 'cursor-trail';
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.opacity = '0.8';

            // 添加爱心图标
            cursor.innerHTML = '💕';

            // 添加到轨迹数组
            cursorTrail.push(cursor);
            document.body.appendChild(cursor);

            // 限制轨迹长度
            if (cursorTrail.length > maxTrailLength) {
                const oldCursor = cursorTrail.shift();
                oldCursor.style.transition = 'opacity 0.5s';
                oldCursor.style.opacity = '0';
                setTimeout(() => {
                    oldCursor.remove();
                }, 500);
            }

            // 2秒后移除
            setTimeout(() => {
                cursor.style.transition = 'opacity 0.5s';
                cursor.style.opacity = '0';
                setTimeout(() => cursor.remove(), 500);
            }, 2000);
        });

        // 点击特效
        document.addEventListener('click', (e) => {
            const clickEffect = document.createElement('div');
            clickEffect.className = 'click-effect';
            clickEffect.style.left = e.clientX + 'px';
            clickEffect.style.top = e.clientY + 'px';

            // 随机选择一个爱心表情
            const hearts = ['❤️', '💕', '💖', '💗', '💘', '💝', '💟'];
            const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
            clickEffect.innerHTML = randomHeart;

            document.body.appendChild(clickEffect);

            // 动画效果
            clickEffect.style.animation = 'clickPop 1s ease-out forwards';

            // 移除元素
            setTimeout(() => {
                clickEffect.remove();
            }, 1000);
        });

        // 照片上传功能
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const galleryGrid = document.getElementById('galleryGrid');
        const savePhotosBtn = document.getElementById('savePhotosBtn');
        const clearPhotosBtn = document.getElementById('clearPhotosBtn');

        // 从localStorage获取照片
        function getPhotos() {
            const photos = localStorage.getItem('lovePhotos');
            return photos ? JSON.parse(photos) : [];
        }

        // 保存照片到localStorage
        function savePhotos(photos) {
            localStorage.setItem('lovePhotos', JSON.stringify(photos));
        }

        // 渲染照片网格
        function renderPhotos() {
            const photos = getPhotos();
            galleryGrid.innerHTML = '';

            if (photos.length === 0) {
                galleryGrid.innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 40px;">
                        <div class="empty-icon">📷</div>
                        <p class="empty-text">还没有照片哦</p>
                        <p class="empty-subtext">上传你们的美好瞬间吧！</p>
                    </div>
                `;
                return;
            }

            // 创建九宫格布局
            const gridContainer = document.createElement('div');
            gridContainer.className = 'photo-grid';

            photos.forEach((photo, index) => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                photoItem.innerHTML = `
                    <img src="${photo.url}" alt="恋爱照片 ${index + 1}">
                    <div class="photo-overlay">
                        <p class="photo-date">${photo.date}</p>
                        <button class="delete-photo" data-index="${index}">🗑️</button>
                    </div>
                `;
                gridContainer.appendChild(photoItem);
            });

            galleryGrid.appendChild(gridContainer);
        }

        // 处理文件上传
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'rgba(255, 105, 180, 0.1)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';

            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const photos = getPhotos();
            const currentDate = new Date().toLocaleDateString('zh-CN');

            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const photo = {
                            url: e.target.result,
                            date: currentDate,
                            name: file.name
                        };
                        photos.push(photo);
                        savePhotos(photos);
                        renderPhotos();
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        // 保存照片按钮
        savePhotosBtn.addEventListener('click', () => {
            const photos = getPhotos();
            if (photos.length === 0) {
                showSuccessMessage('没有照片需要保存！');
                return;
            }
            showSuccessMessage('照片已保存！');
        });

        // 清空照片按钮
        clearPhotosBtn.addEventListener('click', () => {
            if (confirm('确定要清空所有照片吗？')) {
                savePhotos([]);
                renderPhotos();
                showSuccessMessage('照片已清空！');
            }
        });

        // 删除单张照片
        galleryGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-photo')) {
                const index = parseInt(e.target.dataset.index);
                const photos = getPhotos();
                photos.splice(index, 1);
                savePhotos(photos);
                renderPhotos();
                showSuccessMessage('照片已删除！');
            }
        });

        // 显示成功消息
        function showSuccessMessage(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #4CAF50, #8BC34A);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 2000;
                animation: slideInRight 0.3s ease;
                font-weight: 600;
            `;
            toast.textContent = message;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes clickPop {
                0% {
                    transform: scale(0) rotate(0deg);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.5) rotate(180deg);
                    opacity: 0.8;
                }
                100% {
                    transform: scale(0) rotate(360deg);
                    opacity: 0;
                }
            }

            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }

            /* 拖尾式光标样式 */
            .cursor-trail {
                position: fixed;
                pointer-events: none;
                z-index: 9999;
                font-size: 2rem;
                transform: translate(-50%, -50%);
                transition: all 0.1s ease;
                opacity: 0.8;
            }

            /* 照片上传区域样式 */
            .upload-section {
                margin-bottom: 30px;
            }

            .upload-area {
                border: 3px dashed #ff6b95;
                border-radius: 20px;
                padding: 40px;
                text-align: center;
                cursor: pointer;
                transition: all 0.3s ease;
                background: rgba(255, 255, 255, 0.9);
            }

            .upload-area:hover {
                background: rgba(255, 192, 203, 0.2);
                border-color: #ff8fab;
            }

            .upload-icon {
                font-size: 3rem;
                margin-bottom: 15px;
            }

            .upload-text {
                color: #c2185b;
                font-size: 1.1rem;
                font-weight: 600;
            }

            .upload-actions {
                display: flex;
                gap: 15px;
                justify-content: center;
                margin-top: 20px;
            }

            /* 照片网格样式 */
            .photo-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }

            .photo-item {
                position: relative;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }

            .photo-item:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            }

            .photo-item img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                display: block;
            }

            .photo-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
                padding: 15px;
                color: white;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .photo-date {
                margin: 0;
                font-size: 0.9rem;
                opacity: 0.9;
            }

            .delete-photo {
                background: rgba(255, 255, 255, 0.2);
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                color: white;
                cursor: pointer;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            .delete-photo:hover {
                background: rgba(255, 255, 255, 0.4);
                transform: scale(1.1);
            }
        `;
        document.head.appendChild(style);

        // 初始化页面
        renderPhotos();
    </script>
</body>
</html>
