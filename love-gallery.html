<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱图库 - 祖家琦 ❤️ 王意颖</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="heart-background">
        <div class="floating-heart" style="left: 10%; animation-delay: 0s;">💕</div>
        <div class="floating-heart" style="left: 25%; animation-delay: 1s;">💖</div>
        <div class="floating-heart" style="left: 40%; animation-delay: 2s;">💗</div>
        <div class="floating-heart" style="left: 60%; animation-delay: 0.5s;">💕</div>
        <div class="floating-heart" style="left: 75%; animation-delay: 1.5s;">💖</div>
        <div class="floating-heart" style="left: 90%; animation-delay: 2.5s;">❤️</div>
    </div>

    <div class="container">
        <header class="gallery-header">
            <h1 class="gallery-title">📸 恋爱图库</h1>
            <p class="gallery-subtitle">记录我们每一个甜蜜的瞬间</p>
            <div class="back-nav">
                <a href="index.html" class="back-button">🏠 返回首页</a>
            </div>
        </header>

        <div class="gallery-content">
            <!-- 照片上传区域 -->
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <p class="upload-text">点击或拖拽照片到此处上传</p>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                </div>

                <div class="upload-actions">
                    <button class="btn btn-primary" id="savePhotosBtn">💾 保存照片</button>
                    <button class="btn btn-secondary" id="clearPhotosBtn">🗑️ 清空照片</button>
                </div>
            </div>

            <!-- 照片网格 -->
            <div class="gallery-grid" id="galleryGrid">
                <!-- 照片将在这里动态生成 -->
            </div>
        </div>
    </div>

    <script src="data-sharing.js"></script>
    <script src="script.js"></script>
    <script>
        // 拖尾式光标跟随效果
        const cursorTrail = [];
        const maxTrailLength = 10;

        document.addEventListener('mousemove', (e) => {
            // 创建新的光标元素
            const cursor = document.createElement('div');
            cursor.className = 'cursor-trail';
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.opacity = '0.8';

            // 添加爱心图标
            cursor.innerHTML = '💕';

            // 添加到轨迹数组
            cursorTrail.push(cursor);
            document.body.appendChild(cursor);

            // 限制轨迹长度
            if (cursorTrail.length > maxTrailLength) {
                const oldCursor = cursorTrail.shift();
                oldCursor.style.transition = 'opacity 0.5s';
                oldCursor.style.opacity = '0';
                setTimeout(() => {
                    oldCursor.remove();
                }, 500);
            }

            // 2秒后移除
            setTimeout(() => {
                cursor.style.transition = 'opacity 0.5s';
                cursor.style.opacity = '0';
                setTimeout(() => cursor.remove(), 500);
            }, 2000);
        });

        // 点击特效
        document.addEventListener('click', (e) => {
            const clickEffect = document.createElement('div');
            clickEffect.className = 'click-effect';
            clickEffect.style.left = e.clientX + 'px';
            clickEffect.style.top = e.clientY + 'px';

            // 随机选择一个爱心表情
            const hearts = ['❤️', '💕', '💖', '💗', '💘', '💝', '💟'];
            const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
            clickEffect.innerHTML = randomHeart;

            document.body.appendChild(clickEffect);

            // 动画效果
            clickEffect.style.animation = 'clickPop 1s ease-out forwards';

            // 移除元素
            setTimeout(() => {
                clickEffect.remove();
            }, 1000);
        });

        // 照片上传功能
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const galleryGrid = document.getElementById('galleryGrid');
        const savePhotosBtn = document.getElementById('savePhotosBtn');
        const clearPhotosBtn = document.getElementById('clearPhotosBtn');

        // 从localStorage获取照片（旧数据无id时自动补充）
        function getPhotos() {
            let photos = [];
            try {
                photos = JSON.parse(localStorage.getItem('lovePhotos') || '[]');
            } catch (e) { photos = []; }
            // 给没有 id 的旧照片自动补充唯一 id
            let needSave = false;
            photos.forEach(p => {
                if (!p.id) {
                    p.id = Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
                    needSave = true;
                }
            });
            if (needSave) {
                try { localStorage.setItem('lovePhotos', JSON.stringify(photos)); } catch (e) {}
            }
            return photos;
        }

        // 保存照片到localStorage（同时推送到云端，与对方共享）
        function savePhotos(photos) {
            try {
                localStorage.setItem('lovePhotos', JSON.stringify(photos));
            } catch (e) {
                // localStorage 容量不足（通常5MB上限，base64照片较大）
                alert('⚠️ 本地存储空间不足！照片较多时可能无法全部保存在本机。\n\n建议：\n1. 删除一些旧照片腾出空间\n2. 照片会自动同步到云端，对方设备上仍可查看');
                return false;
            }
            // 云端共享：异步推送，失败自动保留本地
            if (window.LoveCloud) {
                LoveCloud.pushPhotos(photos);
            }
            return true;
        }

        // 渲染照片网格
        function renderPhotos() {
            const photos = getPhotos();
            galleryGrid.innerHTML = '';

            if (photos.length === 0) {
                galleryGrid.innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 40px;">
                        <div class="empty-icon">📷</div>
                        <p class="empty-text">还没有照片哦</p>
                        <p class="empty-subtext">上传你们的美好瞬间吧！</p>
                    </div>
                `;
                return;
            }

            // 创建九宫格布局
            const gridContainer = document.createElement('div');
            gridContainer.className = 'photo-grid';

            photos.forEach((photo, index) => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                photoItem.innerHTML = `
                    <img src="${photo.url}" alt="恋爱照片 ${index + 1}">
                    <div class="photo-overlay">
                        <p class="photo-date">${photo.date}</p>
                        <button class="delete-photo" data-index="${index}">🗑️</button>
                    </div>
                `;
                gridContainer.appendChild(photoItem);
            });

            galleryGrid.appendChild(gridContainer);
        }

        // 处理文件上传
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'rgba(255, 105, 180, 0.1)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';

            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 压缩图片：最大宽度1280px，JPEG质量0.8，大幅减小base64体积
        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // 计算缩放比例
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round(height * (maxWidth / width));
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        // 导出为JPEG（PNG透明图也转JPEG，体积更小）
                        const dataUrl = canvas.toDataURL('image/jpeg', quality || 0.8);
                        resolve(dataUrl);
                    };
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsDataURL(file);
            });
        }

        function handleFiles(files) {
            const currentDate = new Date().toLocaleDateString('zh-CN');
            const fileArray = Array.from(files).filter(f => f.type.startsWith('image/'));
            if (fileArray.length === 0) return;

            showSuccessMessage(`正在处理 ${fileArray.length} 张照片...`);

            let processed = 0;
            fileArray.forEach(async (file) => {
                try {
                    // 先压缩再保存
                    const compressedUrl = await compressImage(file, 1280, 0.8);
                    // 每次读取完成后重新获取最新照片列表，防止并发上传丢失
                    const photos = getPhotos();
                    const photo = {
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 6),
                        url: compressedUrl,
                        date: currentDate,
                        name: file.name,
                        originalSize: file.size,
                        compressedSize: Math.round(compressedUrl.length * 0.75) // base64约3/4字节
                    };
                    photos.push(photo);
                    savePhotos(photos);
                    renderPhotos();
                    processed++;
                    if (processed === fileArray.length) {
                        showSuccessMessage(`已保存 ${fileArray.length} 张照片（已自动压缩）`);
                    }
                } catch (err) {
                    console.warn('照片处理失败:', err);
                    processed++;
                    if (processed === fileArray.length) {
                        showSuccessMessage('部分照片处理失败，请重试');
                    }
                }
            });
        }

        // 保存照片按钮
        savePhotosBtn.addEventListener('click', () => {
            const photos = getPhotos();
            if (photos.length === 0) {
                showSuccessMessage('没有照片需要保存！');
                return;
            }
            showSuccessMessage('照片已保存！');
        });

        // 清空照片按钮
        clearPhotosBtn.addEventListener('click', () => {
            if (confirm('确定要清空所有照片吗？')) {
                savePhotos([]);
                renderPhotos();
                showSuccessMessage('照片已清空！');
            }
        });

        // 删除单张照片
        galleryGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-photo')) {
                const index = parseInt(e.target.dataset.index);
                const photos = getPhotos();
                photos.splice(index, 1);
                savePhotos(photos);
                renderPhotos();
                showSuccessMessage('照片已删除！');
            }
        });

        // 显示成功消息
        function showSuccessMessage(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #4CAF50, #8BC34A);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 2000;
                animation: slideInRight 0.3s ease;
                font-weight: 600;
            `;
            toast.textContent = message;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes clickPop {
                0% {
                    transform: scale(0) rotate(0deg);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.5) rotate(180deg);
                    opacity: 0.8;
                }
                100% {
                    transform: scale(0) rotate(360deg);
                    opacity: 0;
                }
            }

            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }

            /* 拖尾式光标样式 */
            .cursor-trail {
                position: fixed;
                pointer-events: none;
                z-index: 9999;
                font-size: 2rem;
                transform: translate(-50%, -50%);
                transition: all 0.1s ease;
                opacity: 0.8;
            }

            /* 照片上传区域样式 */
            .upload-section {
                margin-bottom: 30px;
            }

            .upload-area {
                border: 3px dashed #ff6b95;
                border-radius: 20px;
                padding: 40px;
                text-align: center;
                cursor: pointer;
                transition: all 0.3s ease;
                background: rgba(255, 255, 255, 0.9);
            }

            .upload-area:hover {
                background: rgba(255, 192, 203, 0.2);
                border-color: #ff8fab;
            }

            .upload-icon {
                font-size: 3rem;
                margin-bottom: 15px;
            }

            .upload-text {
                color: #c2185b;
                font-size: 1.1rem;
                font-weight: 600;
            }

            .upload-actions {
                display: flex;
                gap: 15px;
                justify-content: center;
                margin-top: 20px;
            }

            /* 照片网格样式 */
            .photo-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }

            .photo-item {
                position: relative;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }

            .photo-item:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            }

            .photo-item img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                display: block;
            }

            .photo-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
                padding: 15px;
                color: white;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .photo-date {
                margin: 0;
                font-size: 0.9rem;
                opacity: 0.9;
            }

            .delete-photo {
                background: rgba(255, 255, 255, 0.2);
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                color: white;
                cursor: pointer;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            .delete-photo:hover {
                background: rgba(255, 255, 255, 0.4);
                transform: scale(1.1);
            }
        `;
        document.head.appendChild(style);

        // 初始化页面
        renderPhotos();

        // 云端共享：打开图库时拉取对方保存的最新照片并刷新（失败静默，不影响本地）
        if (window.LoveCloud) {
            LoveCloud.pullPhotos().then(function (cloudPhotos) {
                if (cloudPhotos) renderPhotos();
            });
        }
    </script>
</body>
</html>
