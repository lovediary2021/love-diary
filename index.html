<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祖家琦 ❤️ 王意颖 - 我们的恋爱时光</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="heart-background">
        <!-- 飘动的心形装饰 -->
        <div class="floating-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
        <div class="floating-heart" style="left: 20%; animation-delay: 1s;">💕</div>
        <div class="floating-heart" style="left: 30%; animation-delay: 2s;">💖</div>
        <div class="floating-heart" style="left: 50%; animation-delay: 0.5s;">💗</div>
        <div class="floating-heart" style="left: 70%; animation-delay: 1.5s;">💕</div>
        <div class="floating-heart" style="left: 80%; animation-delay: 2.5s;">❤️</div>
        <div class="floating-heart" style="left: 90%; animation-delay: 3s;">💖</div>
    </div>

    <div class="container">
        <header class="hero-section">
            <div class="couple-names">
                <h1 class="name-gradient">祖家琦</h1>
                <div class="heart-divider">
                    <span class="big-heart">💕</span>
                </div>
                <h1 class="name-gradient">王意颖</h1>
            </div>

            <div class="love-date">
                <p class="date-text">我们的爱情开始于</p>
                <div class="date-display">
                    <span class="date-number">2021</span>
                    <span class="date-divider">年</span>
                    <span class="date-number">5</span>
                    <span class="date-divider">月</span>
                    <span class="date-number">2</span>
                    <span class="date-divider">日</span>
                </div>
            </div>

            <div class="love-counter">
                <p class="counter-text">我们已经在一起</p>
                <div class="counter-display">
                    <span id="daysCounter">0</span>
                    <span class="counter-label">天</span>
                    <span id="hoursCounter">0</span>
                    <span class="counter-label">小时</span>
                    <span id="minutesCounter">0</span>
                    <span class="counter-label">分钟</span>
                    <span id="secondsCounter">0</span>
                    <span class="counter-label">秒</span>
                </div>
            </div>

            <!-- 节日/纪念日提醒 -->
            <div class="reminder-card" id="reminderCard">
                <div class="reminder-today" id="reminderToday"></div>
                <div class="reminder-countdown" id="reminderCountdown"></div>
            </div>

            <div class="love-message">
                <p class="message-text">愿我们的爱情永远甜蜜如初</p>
                <p class="message-subtext">💝 两个人，一份爱，一生承诺 💝</p>
            </div>

            <div class="navigation">
                <a href="diary.html" class="nav-button">
                    <span class="button-icon">📖</span>
                    <span class="button-text">打开恋爱日记</span>
                </a>
                <a href="love-gallery.html" class="nav-button" style="margin-left: 15px;">
                    <span class="button-icon">📸</span>
                    <span class="button-text">查看恋爱图库</span>
                </a>
                <a href="games.html" class="nav-button" style="margin-left: 15px;">
                    <span class="button-icon">🎮</span>
                    <span class="button-text">恋爱小游戏</span>
                </a>
                            </div>
        </header>
    </div>

    
    <!-- 背景音乐：默认播放内置的舒缓轻音乐（无需文件）；
         想换成自己的曲子，把音频命名为 music.mp3 放到本文件夹即可自动优先播放 -->
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>
    <button id="musicToggle" class="music-btn" title="播放背景音乐">🎵</button>

    <script src="script.js"></script>
<script src="mobile-optimizations.js"></script>
    <script>
        // 拖尾式光标跟随效果
        const cursorTrail = [];
        const maxTrailLength = 10;

        document.addEventListener('mousemove', (e) => {
            // 创建新的光标元素
            const cursor = document.createElement('div');
            cursor.className = 'cursor-trail';
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.opacity = '0.3'; // 透明度设置为0.3

            // 添加爱心图标
            cursor.innerHTML = '💕';

            // 添加到轨迹数组
            cursorTrail.push(cursor);
            document.body.appendChild(cursor);

            // 限制轨迹长度
            if (cursorTrail.length > maxTrailLength) {
                const oldCursor = cursorTrail.shift();
                oldCursor.style.transition = 'opacity 0.5s';
                oldCursor.style.opacity = '0';
                setTimeout(() => {
                    oldCursor.remove();
                }, 500);
            }

            // 2秒后移除
            setTimeout(() => {
                cursor.style.transition = 'opacity 0.5s';
                cursor.style.opacity = '0';
                setTimeout(() => cursor.remove(), 500);
            }, 2000);
        });

        // 点击特效
        document.addEventListener('click', (e) => {
            const clickEffect = document.createElement('div');
            clickEffect.className = 'click-effect';
            clickEffect.style.left = e.clientX + 'px';
            clickEffect.style.top = e.clientY + 'px';

            // 随机选择一个爱心表情
            const hearts = ['❤️', '💕', '💖', '💗', '💘', '💝', '💟'];
            const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
            clickEffect.innerHTML = randomHeart;

            document.body.appendChild(clickEffect);

            // 动画效果
            clickEffect.style.animation = 'clickPop 1s ease-out forwards';

            // 移除元素
            setTimeout(() => {
                clickEffect.remove();
            }, 1000);
        });

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes clickPop {
                0% {
                    transform: scale(0) rotate(0deg);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.5) rotate(180deg);
                    opacity: 0.8;
                }
                100% {
                    transform: scale(0) rotate(360deg);
                    opacity: 0;
                }
            }

            /* 拖尾式光标样式 */
            .cursor-trail {
                position: fixed;
                pointer-events: none;
                z-index: 9999;
                font-size: 2rem;
                transform: translate(-50%, -50%);
                transition: all 0.1s ease;
                opacity: 0.3;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
