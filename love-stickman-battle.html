<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人乱斗 - 祖家琦 ❤️ 王意颖</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #c2185b;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        .game-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(194, 24, 91, 0.3);
            position: relative;
        }

        #gameCanvas {
            border: 2px solid #c2185b;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #90EE90 100%);
        }

        .controls {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 20px;
        }

        .player-controls {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .player-controls h3 {
            color: #c2185b;
            margin-bottom: 10px;
        }

        .control-info {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 20px;
        }

        .player-health {
            text-align: center;
        }

        .health-bar {
            width: 200px;
            height: 30px;
            background: #f0f0f0;
            border: 2px solid #c2185b;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }

        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .player1-health {
            background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
        }

        .player2-health {
            background: linear-gradient(90deg, #4ecdc4, #7ee8df);
        }

        .health-text {
            margin-top: 5px;
            font-weight: bold;
            color: #c2185b;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            font-size: 2rem;
            color: #c2185b;
            display: none;
            z-index: 1000;
        }

        .message button {
            margin-top: 20px;
            padding: 10px 30px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .message button:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        .love-icon {
            color: #c2185b;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .combo-indicator {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff1493;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <a href="games.html" class="back-button">返回游戏目录</a>
        <a href="index.html" class="back-button" style="background: #999;">返回首页</a>
    </div>

    <div class="header">
        <h1>火柴人乱斗 <span class="love-icon">💕</span></h1>
        <p>两个火柴人的爱情对决！</p>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="combo-indicator" id="comboIndicator"></div>
    </div>

    <div class="controls">
        <div class="player-controls">
            <h3>玩家1（祖家琦）</h3>
            <div class="control-info">
                <p>移动：W A S D</p>
                <p>攻击：F</p>
                <p>跳跃：空格</p>
                <p>防守：G</p>
            </div>
        </div>
        <div class="player-controls">
            <h3>玩家2（王意颖）</h3>
            <div class="control-info">
                <p>移动：方向键 ← ↑ → ↓</p>
                <p>攻击：Enter</p>
                <p>跳跃：Shift</p>
                <p>防守：M</p>
            </div>
        </div>
    </div>

    <div class="game-stats">
        <div class="player-health">
            <div>祖家琦</div>
            <div class="health-bar">
                <div class="health-fill player1-health" id="player1Health" style="width: 100%"></div>
            </div>
            <div class="health-text" id="player1HealthText">100/100</div>
        </div>
        <div class="player-health">
            <div>王意颖</div>
            <div class="health-bar">
                <div class="health-fill player2-health" id="player2Health" style="width: 100%"></div>
            </div>
            <div class="health-text" id="player2HealthText">100/100</div>
        </div>
    </div>

    <div class="message" id="gameMessage">
        <div id="messageText"></div>
        <button onclick="resetGame()">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const message = document.getElementById('gameMessage');
        const messageText = document.getElementById('messageText');
        const comboIndicator = document.getElementById('comboIndicator');

        // 游戏状态
        let gameRunning = true;
        let keys = {};

        // 玩家类
        class Stickman {
            constructor(x, y, color, controls, name) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 60;
                this.color = color;
                this.controls = controls;
                this.name = name;
                this.health = 100;
                this.maxHealth = 100;
                this.velocityX = 0;
                this.velocityY = 0;
                this.isJumping = false;
                this.isAttacking = false;
                this.isDefending = false;
                this.facing = 1; // 1为右，-1为左
                this.combo = 0;
                this.attackCooldown = 0;
                this.hitCooldown = 0;
                this.defendCooldown = 0;
            }

            update() {
                // 移动
                if (keys[this.controls.left]) {
                    this.velocityX = -5;
                    this.facing = -1;
                } else if (keys[this.controls.right]) {
                    this.velocityX = 5;
                    this.facing = 1;
                } else {
                    this.velocityX *= 0.8; // 摩擦力
                }

                // 跳跃
                if (keys[this.controls.jump] && !this.isJumping) {
                    this.velocityY = -15;
                    this.isJumping = true;
                }

                // 攻击
                if (keys[this.controls.attack] && this.attackCooldown <= 0) {
                    this.isAttacking = true;
                    this.attackCooldown = 30;
                    this.checkAttack();
                }

                // 防守
                if (keys[this.controls.defend] && this.defendCooldown <= 0) {
                    this.isDefending = true;
                    this.defendCooldown = 60;
                } else {
                    this.isDefending = false;
                }

                // 重力
                this.velocityY += 0.8;

                // 更新位置
                this.x += this.velocityX;
                this.y += this.velocityY;

                // 边界检测
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

                // 地面检测
                if (this.y + this.height > canvas.height - 50) {
                    this.y = canvas.height - 50 - this.height;
                    this.velocityY = 0;
                    this.isJumping = false;
                }

                // 更新冷却
                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.hitCooldown > 0) this.hitCooldown--;
                if (this.defendCooldown > 0) this.defendCooldown--;
                if (this.isAttacking && this.attackCooldown < 20) {
                    this.isAttacking = false;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.scale(this.facing, 1);

                // 火柴人身体
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';

                // 头
                ctx.beginPath();
                ctx.arc(0, -20, 10, 0, Math.PI * 2);
                ctx.stroke();

                // 身体
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(0, 20);
                ctx.stroke();

                // 左臂
                ctx.beginPath();
                ctx.moveTo(-10, 0);
                if (this.isAttacking && this.facing === 1) {
                    ctx.lineTo(-20, -10);
                } else {
                    ctx.lineTo(-15, 5);
                }
                ctx.stroke();

                // 右臂
                ctx.beginPath();
                ctx.moveTo(10, 0);
                if (this.isAttacking && this.facing === 1) {
                    ctx.lineTo(20, -10);
                } else if (this.isDefending) {
                    ctx.lineTo(20, 10);
                } else {
                    ctx.lineTo(15, 5);
                }
                ctx.stroke();

                // 左腿
                ctx.beginPath();
                ctx.moveTo(-5, 20);
                ctx.lineTo(-10, 40);
                ctx.stroke();

                // 右腿
                ctx.beginPath();
                ctx.moveTo(5, 20);
                ctx.lineTo(10, 40);
                ctx.stroke();

                // 绘制防御盾牌效果
                if (this.isDefending) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 25, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            checkAttack() {
                const attackRange = 50;
                const other = this === player1 ? player2 : player1;
                const distance = Math.abs(this.x - other.x);

                if (distance < attackRange) {
                    const damage = 10 + this.combo * 2;
                    other.takeDamage(damage);
                    this.combo++;

                    // 显示连击
                    if (this.combo > 1) {
                        showCombo(this.x + this.width/2, this.y - 50, `${this.combo}连击!`);
                    }
                } else {
                    this.combo = 0;
                }
            }

            takeDamage(damage) {
                if (this.hitCooldown > 0) return;

                // 如果在防御状态，减少伤害
                let actualDamage = damage;
                if (this.isDefending) {
                    actualDamage = Math.floor(damage * 0.3); // 防御减少70%伤害
                }

                this.health -= actualDamage;
                this.hitCooldown = 20;

                if (this.health <= 0) {
                    this.health = 0;
                    gameRunning = false;
                }

                updateHealthBars();
            }
        }

        // 创建玩家
        const player1 = new Stickman(200, 100, '#ff6b6b', {
            left: 'a',
            right: 'd',
            jump: ' ',
            attack: 'f',
            defend: 'g'
        }, '祖家琦');

        const player2 = new Stickman(600, 100, '#4ecdc4', {
            left: 'ArrowLeft',
            right: 'ArrowRight',
            jump: 'Shift',
            attack: 'Enter',
            defend: 'm'
        }, '王意颖');

        // 显示连击
        function showCombo(x, y, text) {
            comboIndicator.textContent = text;
            comboIndicator.style.left = x + 'px';
            comboIndicator.style.top = y + 'px';
            comboIndicator.style.display = 'block';

            setTimeout(() => {
                comboIndicator.style.display = 'none';
            }, 1000);
        }

        // 更新血条
        function updateHealthBars() {
            const player1HealthPercent = (player1.health / player1.maxHealth) * 100;
            const player2HealthPercent = (player2.health / player2.maxHealth) * 100;

            document.getElementById('player1Health').style.width = player1HealthPercent + '%';
            document.getElementById('player2Health').style.width = player2HealthPercent + '%';
            document.getElementById('player1HealthText').textContent = `${player1.health}/${player1.maxHealth}`;
            document.getElementById('player2HealthText').textContent = `${player2.health}/${player2.maxHealth}`;
        }

        // 绘制地面
        function drawGround() {
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // 草地纹理
            ctx.strokeStyle = '#228B22';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - 50);
                ctx.lineTo(i + 10, canvas.height - 40);
                ctx.lineTo(i + 20, canvas.height - 50);
                ctx.stroke();
            }
        }

        // 游戏循环
        function gameLoop() {
            if (!gameRunning) return;

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.6, '#87CEEB');
            gradient.addColorStop(0.6, '#90EE90');
            gradient.addColorStop(1, '#90EE90');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制地面
            drawGround();

            // 更新和绘制玩家
            player1.update();
            player2.update();
            player1.draw();
            player2.draw();
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // 重置游戏
        function resetGame() {
            gameRunning = true;
            player1.health = player1.maxHealth;
            player2.health = player2.maxHealth;
            player1.x = 200;
            player1.y = 100;
            player2.x = 600;
            player2.y = 100;
            player1.velocityX = 0;
            player1.velocityY = 0;
            player2.velocityX = 0;
            player2.velocityY = 0;
            player1.combo = 0;
            player2.combo = 0;
            player1.attackCooldown = 0;
            player2.attackCooldown = 0;
            player1.hitCooldown = 0;
            player2.hitCooldown = 0;
            player1.defendCooldown = 0;
            player2.defendCooldown = 0;
            player1.isDefending = false;
            player2.isDefending = false;

            updateHealthBars();
            message.style.display = 'none';
        }

        // 检查游戏结束
        setInterval(() => {
            if (!gameRunning) {
                const winner = player1.health === 0 ? '王意颖' : '祖家琦';
                messageText.textContent = `${winner} 获胜！`;
                message.style.display = 'block';
            }
        }, 100);

        // 开始游戏循环
        setInterval(gameLoop, 1000/60); // 60 FPS
    </script>
</body>
</html>
