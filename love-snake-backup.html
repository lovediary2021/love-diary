<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱贪吃蛇 - 祖家琦 ❤️ 王意颖</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft YaHe', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #c2185b;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        #gameCanvas {
            border: 3px solid #c2185b;
            border-radius: 10px;
            background: white;
            box-shadow: 0 0 20px rgba(194, 24, 91, 0.3);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            width: 500px;
            margin-top: 20px;
            color: #c2185b;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
            color: #666;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: none;
            max-width: 400px;
            width: 90%;
        }

        .love-hint {
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #ffe6f0 0%, #ffebf0 100%);
            border-radius: 10px;
            border: 2px solid #ffcdd2;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes rainbow {
            0% { border-color: #ff6b95; }
            14% { border-color: #ff8e53; }
            28% { border-color: #ffb347; }
            42% { border-color: #cddc39; }
            56% { border-color: #66bb6a; }
            70% { border-color: #42a5f5; }
            84% { border-color: #ab47bc; }
            100% { border-color: #ef5350; }
        }

        .love-heart {
            color: #c2185b;
            margin: 0 5px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .heartbeat {
            animation: heartbeat 1s infinite;
        }

        .hint-level {
            font-size: 1.1rem;
            color: #c2185b;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .hint-level.level1 { opacity: 0.7; }
        .hint-level.level2 { opacity: 0.85; }
        .hint-level.level3 { opacity: 1; color: #ff1493; }
    </style>
</head>
<body>
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <a href="games.html" class="back-button">返回游戏目录</a>
        <a href="index.html" class="back-button" style="background: #999;">返回首页</a>
    </div>

    <div class="header">
        <h1>恋爱贪吃蛇 <span class="love-heart">💕</span></h1>
        <p>小蛇会变成爱心的形状！控制小蛇收集更多的爱心吧！</p>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="game-info">
        <div class="score">得分: <span id="score">0</span></div>
        <div class="score">最高分: <span id="highScore">0</span></div>
        <div class="hint-level" id="hintLevel" style="display: none;">
            提示等级: <span id="hintLevelText"></span>
        </div>
    </div>

    <div class="controls">
        <p>使用 W A S D 控制小蛇移动（W上 A左 S下 D右）</p>
        <p>收集红色爱心获得分数！</p>
        <p style="font-size: 0.9rem; color: #888; margin-top: 10px;">
            💎 <strong>道具说明：</strong><br>
            🏹💈 <strong>减速道具</strong> - 被丘比特射中的爱心，让小蛇速度减慢10秒<br>
            💎 <strong>10倍分数道具</strong> - 下次获得的爱心获得10倍分数<br>
            ✨ <strong>双倍加分道具</strong> - 120秒内获得的爱心分数翻倍
        </p>
        <p id="hintDescription" style="font-size: 0.9rem; color: #888; margin-top: 10px;">
            💡 提示：得分越高，恋人提示越明显！100分解锁初级提示哦~
        </p>
    </div>

    <div id="gameOver" class="game-over">
        <h2>游戏结束！</h2>
        <p>最终得分: <span id="finalScore">0</span></p>
        <button onclick="resetGame()" style="margin-top: 15px; padding: 10px 20px; background: #ff69b4; color: white; border: none; border-radius: 20px; cursor: pointer;">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        // 游戏配置
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let baseGameSpeed = 150; // 基础游戏速度（毫秒）
        let currentGameSpeed = baseGameSpeed;

        let snake = [
            {x: 10, y: 10}
        ];
        let dx = 0;
        let dy = 0;
        let foodX = 15;
        let foodY = 15;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;

        // 道具系统
        let items = [];
        let scoreMultiplier = 1; // 当前分数倍数
        let doubleScoreActive = false; // 双倍加分激活状态
        let doubleScoreEndTime = 0; // 双倍加分结束时间

        highScoreElement.textContent = highScore;

        // 绘制爱心函数
        function drawHeart(x, y, size) {
            ctx.save();
            ctx.translate(x + gridSize/2, y + gridSize/2);
            ctx.scale(size/20, size/20);
            ctx.fillStyle = '#c2185b';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-10, -10, -20, -5, -10, 5);
            ctx.bezierCurveTo(0, 10, 0, 20, 0, 20);
            ctx.bezierCurveTo(0, 20, 0, 10, 10, 5);
            ctx.bezierCurveTo(20, -5, 10, -10, 0, 0);
            ctx.fill();
            ctx.restore();
        }

        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇
            snake.forEach((segment, index) => {
                const size = index === 0 ? 18 : 16; // 蛇头稍大
                drawHeart(segment.x * gridSize + 2, segment.y * gridSize + 2, size);
            });

            // 绘制食物
            ctx.fillStyle = '#ff1744';
            ctx.font = '20px Arial';
            ctx.fillText('❤', foodX * gridSize, foodY * gridSize + 20);

            // 绘制道具
            items.forEach((item, index) => {
                if (item.type === 'slow') {
                    // 减速道具 - 被丘比特射中的爱心
                    ctx.fillStyle = '#4CAF50';
                    ctx.font = '16px Arial';
                    ctx.fillText('🏹', item.x * gridSize, item.y * gridSize + 18);
                    ctx.fillStyle = '#FF0000';
                    ctx.font = '14px Arial';
                    ctx.fillText('❤', item.x * gridSize, item.y * gridSize + 18);
                } else if (item.type === 'multiplier') {
                    // 10倍分数道具 - 10倍爱心
                    ctx.fillStyle = '#FFD700';
                    ctx.font = '16px Arial';
                    ctx.fillText('💎', item.x * gridSize, item.y * gridSize + 18);
                    ctx.fillStyle = '#FF0000';
                    ctx.font = '12px Arial';
                    ctx.fillText('x10', item.x * gridSize + 2, item.y * gridSize + 16);
                } else if (item.type === 'double') {
                    // 双倍加分道具 - 2倍爱心
                    ctx.fillStyle = '#9C27B0';
                    ctx.font = '18px Arial';
                    ctx.fillText('✨', item.x * gridSize, item.y * gridSize + 20);
                }
            });

            // 显示当前状态
            ctx.fillStyle = '#333';
            ctx.font = '14px Arial';
            ctx.fillText(`速度: ${currentGameSpeed === baseGameSpeed * 2 ? '慢' : '正常'}`, 10, 20);

            if (doubleScoreActive) {
                const remainingTime = Math.ceil((doubleScoreEndTime - Date.now()) / 1000);
                ctx.fillStyle = '#9C27B0';
                ctx.fillText(`双倍加分: ${remainingTime}秒`, 100, 20);
            }
        }

        // 移动蛇
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 边界检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 自身碰撞检测
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 吃到食物
            if (head.x === foodX && head.y === foodY) {
                let points = 1;

                // 应用分数倍数
                if (scoreMultiplier > 1) {
                    points *= scoreMultiplier;
                    scoreMultiplier = 1; // 重置分数倍数
                }

                // 应用双倍加分
                if (doubleScoreActive) {
                    points *= 2;
                }

                score += points;
                scoreElement.textContent = score;

                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }

                generateFood();
            }

            // 吃到道具
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                if (head.x === item.x && head.y === item.y) {
                    applyPowerUp(item);
                    items.splice(i, 1);
                }
            }

            // 检查双倍加分是否过期
            if (doubleScoreActive && Date.now() > doubleScoreEndTime) {
                doubleScoreActive = false;
            }
        }

        // 更新提示等级显示
        function updateHintLevel() {
            const hintLevelDiv = document.getElementById('hintLevel');
            const hintLevelText = document.getElementById('hintLevelText');

            if (score < 100) {
                hintLevelDiv.style.display = 'none';
            } else if (score < 200) {
                hintLevelDiv.style.display = 'block';
                hintLevelDiv.className = 'hint-level level1';
                hintLevelText.textContent = '💕 初级（朦胧）';
            } else if (score < 300) {
                hintLevelDiv.style.display = 'block';
                hintLevelDiv.className = 'hint-level level2';
                hintLevelText.textContent = '💖 中级（清晰）';
            } else {
                hintLevelDiv.style.display = 'block';
                hintLevelDiv.className = 'hint-level level3';
                hintLevelText.textContent = '💎 高级（明了）';
            }
        }

        // 生成食物和道具
        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);

            // 确保食物不在蛇身上
            for (let segment of snake) {
                if (foodX === segment.x || foodY === segment.y) {
                    generateFood();
                    return;
                }
            }

            // 随机生成道具
            if (Math.random() < 0.15) { // 15%概率生成道具
                generateItem();
            }

            // 更新提示等级
            updateHintLevel();
        }

        // 生成道具
        function generateItem() {
            let x, y;
            let validPosition = false;

            // 尝试找到不在蛇身上的位置
            while (!validPosition) {
                x = Math.floor(Math.random() * tileCount);
                y = Math.floor(Math.random() * tileCount);

                validPosition = true;
                for (let segment of snake) {
                    if (x === segment.x && y === segment.y) {
                        validPosition = false;
                        break;
                    }
                }
            }

            // 随机选择道具类型
            const itemTypes = ['slow', 'multiplier', 'double'];
            const randomType = itemTypes[Math.floor(Math.random() * itemTypes.length)];

            items.push({
                x: x,
                y: y,
                type: randomType
            });
        }

        // 应用道具效果
        function applyPowerUp(item) {
            if (item.type === 'slow') {
                // 减速效果：速度减半
                currentGameSpeed = baseGameSpeed * 2;
                setTimeout(() => {
                    currentGameSpeed = baseGameSpeed;
                }, 10000); // 10秒后恢复
            } else if (item.type === 'multiplier') {
                // 10倍分数效果
                scoreMultiplier = 10;
                // 显示提示
                showNotification('💎 获得10倍分数！下一颗爱心将获得10倍分数！');
            } else if (item.type === 'double') {
                // 双倍加分效果，持续120秒
                doubleScoreActive = true;
                doubleScoreEndTime = Date.now() + 120000; // 120秒
                // 显示提示
                showNotification('✨ 获得2倍加分！120秒内获得的爱心分数翻倍！');
            }
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.position = 'fixed';
            notification.style.top = '50%';
            notification.style.left = '50%';
            notification.style.transform = 'translate(-50%, -50%)';
            notification.style.background = 'rgba(255, 182, 193, 0.95)';
            notification.style.color = '#c2185b';
            notification.style.padding = '20px';
            notification.style.borderRadius = '10px';
            notification.style.fontSize = '18px';
            notification.style.fontWeight = 'bold';
            notification.style.boxShadow = '0 4px 20px rgba(0,0,0,0.3)';
            notification.style.zIndex = '10000';
            notification.textContent = message;
            notification.style.animation = 'pulse 1s ease-in-out infinite';

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.5s';
                setTimeout(() => notification.remove(), 500);
            }, 2000);
        }

        // "永远的爱情"提示词
        const loveHints = {
            level1: [ // 最不明显的提示（100-200分）
                "时间静止的瞬间",
                "心跳的永恒节拍",
                "星空下的承诺",
                "四季不变的陪伴",
                "掌心的温度",
                "眼中的倒影",
                "晨曦的第一缕光",
                "暮色的最后一抹温柔",
                "梦中的微笑",
                "指尖的触碰",
                "无声的理解",
                "永恒的港湾",
                "温暖的怀抱",
                "心灵的共鸣",
                "灵魂的契约",
                "时间的见证者",
                "岁月的见证人",
                "生命的旅程",
                "温暖的阳光",
                "细雨的滋润",
                "微风的轻抚",
                "花开的声音",
                "叶落的舞蹈",
                "星空的璀璨",
                "月光的皎洁"
            ],
            level2: [ // 第二档提示（200-300分）
                "比时间更长的陪伴",
                "比誓言更深的承诺",
                "比心跳更真的情感",
                "比生命更久的连接",
                "永恒的相守",
                "不变的真心",
                "永远的守护",
                "一生的承诺",
                "无尽的温柔",
                "永恒的温暖",
                "不变的真心",
                "永远的等待",
                "永恒的牵挂",
                "一生的相伴",
                "不变的情感",
                "永远的港湾",
                "永恒的依恋",
                "一生的承诺",
                "不变的爱意",
                "永远的温柔",
                "永恒的思念",
                "一生的守护",
                "不变的心跳",
                "永远的陪伴",
                "永恒的誓言"
            ],
            level3: [ // 最明显的提示（300分以上）
                "四个字，代表一生",
                " longest love",
                "forever + love",
                "永恒的爱情",
                "永远的相爱",
                "一生一世的爱",
                "直到永远的爱",
                "永不停息的爱",
                "永恒不变的爱",
                "永远的承诺",
                "forever love",
                "永远的归属",
                "永恒的陪伴",
                "一生一世的情",
                "直到永远的诺言",
                "永恒的心动",
                "永远的依偎",
                "一生的爱恋",
                "永恒的守候",
                "永远的牵绊",
                "forever love",
                "永恒的誓言",
                "一生的温柔",
                "永远的爱情",
                "Forever Love",
                "eternal love",
                "unending love",
                "boundless love"
            ],
            special: [ // 400分以上的特殊彩蛋提示
                "🎉 恭喜你达到了永恒之境！",
                "💖 你的爱已经超越了时间",
                "✨ 祖家琦和王意颖的爱情密码",
                "🌟 恒久不变的四个字",
                "💝 藏在游戏中的爱情宣言",
                "🎊 恭喜解锁隐藏成就！"
            ]
        };

        // 游戏结束
        function gameOver() {
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';

            // 根据分数显示不同的提示
            let hintLevel = '';
            let hintMessage = '';

            // 400分以上的特殊彩蛋
            if (score >= 400) {
                const randomIndex = Math.floor(Math.random() * loveHints.special.length);
                hintMessage = loveHints.special[randomIndex];

                // 添加特殊效果的提示框
                const hintDiv = document.createElement('div');
                hintDiv.className = 'love-hint';
                hintDiv.style.background = 'linear-gradient(135deg, #ffd6e0 0%, #ffebf5 100%)';
                hintDiv.style.border = '3px solid #ff69b4';
                hintDiv.style.animation = 'pulse 1s ease-in-out infinite, rainbow 3s linear infinite';
                hintDiv.innerHTML = `<strong>🎊 ${hintMessage}</strong>`;

                gameOverElement.querySelector('h2').insertAdjacentHTML('afterend', hintDiv.outerHTML);
            }
            // 300分以上的第三档提示
            else if (score >= 300) {
                const randomIndex = Math.floor(Math.random() * loveHints.level3.length);
                hintMessage = loveHints.level3[randomIndex];
            }
            // 200-299分的第二档提示
            else if (score >= 200) {
                const randomIndex = Math.floor(Math.random() * loveHints.level2.length);
                hintMessage = loveHints.level2[randomIndex];
            }
            // 100-199分的第一档提示
            else if (score >= 100) {
                const randomIndex = Math.floor(Math.random() * loveHints.level1.length);
                hintMessage = loveHints.level1[randomIndex];
            }

            // 如果有提示，添加到游戏结束界面
            if (hintMessage) {
                const hintDiv = document.createElement('div');
                hintDiv.className = 'love-hint';
                hintDiv.innerHTML = `<strong>💕 恋人提示：</strong>${hintMessage}`;

                gameOverElement.querySelector('h2').insertAdjacentHTML('afterend', hintDiv.outerHTML);
            }
        }

        // 重置游戏
        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            items = [];
            currentGameSpeed = baseGameSpeed;
            scoreMultiplier = 1;
            doubleScoreActive = false;
            doubleScoreEndTime = 0;

            // 清除之前添加的提示
            const hints = gameOverElement.querySelectorAll('div[style*="background: #ffe6f0"]');
            hints.forEach(hint => hint.remove());

            generateFood();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (gameOverElement.style.display === 'block') return;

            switch(e.key.toLowerCase()) {
                case 'w':
                    if (dy === 0) {
                        dx = 0;
                        dy = -1;
                    }
                    break;
                case 's':
                    if (dy === 0) {
                        dx = 0;
                        dy = 1;
                    }
                    break;
                case 'a':
                    if (dx === 0) {
                        dx = -1;
                        dy = 0;
                    }
                    break;
                case 'd':
                    if (dx === 0) {
                        dx = 1;
                        dy = 0;
                    }
                    break;
            }
        });

        // 游戏循环 - 使用动态速度
        let gameInterval;

        function gameLoop() {
            if (dx !== 0 || dy !== 0) {
                moveSnake();
            }
            drawGame();
        }

        // 重新开始游戏循环
        function restartGameLoop() {
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            gameInterval = setInterval(gameLoop, currentGameSpeed);
        }

        // 动态调整游戏速度
        function startGameLoop() {
            restartGameLoop();
        }

        // 初始化游戏
        drawGame();
        startGameLoop();
    </script>
</body>
</html>
